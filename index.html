<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Backrooms
        </title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <img id="walking-person" src="assets/walking.gif">
        <main>
            <div id="room-1" class="rooms">
                <div class="scene">
                    <div class="sleep-area">
                        <div id="room-1-bed" class="piece bed">
                            <img src="assets/IMG_2515.PNG">
                        </div>
                        <div id="room-1-rug" class="piece rug">
                            <img src="assets/IMG_2515.PNG">
                        </div>
                    </div>
                    <div id="room-1-desk" class="piece desk">
                        <img src="assets/IMG_2516.PNG">
                    </div>
                    <div id="room-1-side-table" class="piece side-table">
                        <img src="assets/IMG_2517.PNG">
                    </div>
                    <div id="room-1-lounge" class="piece lounge">
                        <img src="assets/IMG_2518.PNG">
                    </div>
                </div>
            </div>
            <div class="wall">
                <div class="front-door">
                </div>
            </div>
            <div id="room-2" class="rooms">
                <div class="scene">
                    <div class="sleep-area">
                        <div id="room-2-bed" class="piece bed">
                            <img src="assets/IMG_2522.PNG">
                        </div>
                        <div id="room-2-rug" class="piece rug">
                            <img src="assets/IMG_2522.PNG">
                        </div>
                    </div>
                    <div id="room-2-desk" class="piece desk">
                        <img src="assets/IMG_2523.PNG">
                    </div>
                    <div id="room-2-side-table" class="piece side-table">
                        <img src="assets/IMG_2519.PNG">
                    </div>
                    <div id="room-2-lounge" class="piece lounge">
                        <img src="assets/IMG_2520.PNG">
                    </div>
                    <div id="room-2-crack" class="piece crack">
                        <img src="assets/IMG_2521.PNG">
                    </div>
                </div>
            </div>
            <div class="wall">
                <div class="front-door">
                </div>
            </div>
            <div id="room-3" class="rooms">
                <div class="scene">
                    <div class="sleep-area">
                        <div id="room-3-bed" class="piece bed">
                            <img src="assets/IMG_2525.PNG">
                        </div>
                        <div id="room-3-rug" class="piece rug">
                            <img src="assets/IMG_2525.PNG">
                        </div>
                    </div>
                    <div id="room-3-desk" class="piece desk">
                        <img src="assets/IMG_2527.PNG">
                    </div>
                    <div id="room-3-side-table" class="piece side-table">
                        <img src="assets/IMG_2524.PNG">
                    </div>
                    <div id="room-3-lounge" class="piece lounge">
                        <img src="assets/IMG_2526.PNG">
                    </div>
                    <div id="room-3-portal" class="piece portal">
                        <img src="assets/IMG_2528.PNG">
                    </div>
                    <!-- Hover over the black opening to reveal nine rows of eyes. -->
                    <div class="eyes" tabindex="0"></div>
                </div>
            </div>
        </main>
    </body>
</html>
